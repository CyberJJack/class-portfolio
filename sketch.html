<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Original p5.js coursework by jkan349, running locally in this portfolio.">
    <title>Sketch viewer · jkan349</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; }
      body { display: flex; flex-direction: column; overflow: hidden; background: #05080a; color: #dce8eb; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .viewer-bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 10px 16px; border-bottom: 1px solid #1c3038; background: #0a1116; }
      .viewer-title { overflow: hidden; margin: 0; color: #eaf6fa; font-size: 12px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
      .viewer-links { display: flex; gap: 18px; flex-shrink: 0; }
      a, button { color: #61d8ec; text-decoration: none; }
      a:hover, button:hover { color: #fff; }
      a:focus-visible, button:focus-visible { outline: 2px solid #61d8ec; outline-offset: 4px; }
      button { border: 0; padding: 0; background: none; cursor: pointer; font: inherit; }
      #stage { position: relative; display: grid; flex: 1 1 auto; width: 100%; min-height: 0; place-items: center; overflow: hidden; background: #000; }
      #stage canvas { display: block; width: auto !important; height: auto !important; max-width: 100%; max-height: 100%; }
      #stage iframe { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #fff; }
      .viewer-hint { flex: 0 0 auto; min-height: 32px; margin: 0; padding: 8px 16px; border-top: 1px solid #1c3038; color: #8aa6b1; font-size: 10px; }
      #status { position: absolute; z-index: 2; max-width: 420px; margin: 28px; text-align: center; }
      #status[hidden] { display: none; }
      #status strong { display: block; margin-bottom: 10px; color: #dce8eb; font-size: 16px; font-weight: 500; }
      #status p { color: #8aa6b1; }
      .camera-start { display: block; min-height: 44px; margin: 20px auto 16px; padding: 11px 16px; border: 1px solid #31515e; border-radius: 3px; background: #10232c; }
      .inline-preview .viewer-bar, .inline-preview .viewer-hint { display: none; }
      .inline-preview #status { margin: 12px; max-width: calc(100% - 24px); font-size: 10px; line-height: 1.4; }
      .inline-preview #status strong { font-size: 12px; margin-bottom: 6px; }
      .inline-preview #status p { margin: 6px 0; }
      .inline-preview .camera-start { min-height: 36px; margin: 10px auto 8px; padding: 8px 9px; font-size: 10px; }
      .inline-preview #status a { font-size: 10px; }
      @media (max-width: 250px) {
        .inline-preview #status.camera-prompt strong, .inline-preview #status.camera-prompt p { display: none; }
        .inline-preview .camera-start { min-height: 34px; margin: 8px auto; padding: 8px; font-size: 9px; }
        .inline-preview #status a { font-size: 9px; }
      }
      @media (max-width: 480px) {
        .viewer-bar { gap: 8px; padding: 10px; }
        .viewer-links { gap: 10px; font-size: 10px; }
        .viewer-hint { padding: 7px 10px; }
      }
    </style>
    <script src="./project-links.js?v=camera-works-13" defer></script>
    <script src="./sketch-runtime.js?v=interactive-cards-14-1" defer></script>
  </head>
  <body>
    <header class="viewer-bar">
      <h1 class="viewer-title" id="sketch-title">p5.js coursework · jkan349</h1>
      <nav class="viewer-links" aria-label="Sketch controls">
        <button id="restart" type="button" hidden>Restart</button>
        <a id="source-link" href="https://editor.p5js.org/jkan349/collections/qvees2nPr" target="_blank" rel="noopener noreferrer">p5.js source ↗</a>
      </nav>
    </header>
    <main id="stage" aria-label="Live p5.js sketch">
      <div id="status" role="status" aria-live="polite"><strong>Loading sketch…</strong><p>Original coursework by jkan349.</p></div>
    </main>
    <p class="viewer-hint" id="sketch-hint">Original p5.js 2.3.2 sketch · jkan349</p>
    <noscript>This interactive sketch needs JavaScript. <a href="https://editor.p5js.org/jkan349/collections/qvees2nPr">Open the original p5.js collection.</a></noscript>
  </body>
</html>
